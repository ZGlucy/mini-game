<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>富足到家 · AI客服（打开即聊）</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--line:#e5e7eb;--txt:#111827;--sub:#6b7280;--me:#95ec69;--brand:#07c160}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt)}
header{position:fixed;top:0;left:0;right:0;background:var(--brand);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:20;padding-top:calc(10px + env(safe-area-inset-top))}
header .av{width:36px;height:36px;border-radius:6px;background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:none}
header .ttl{flex:1;min-width:0}
header b{font-size:15px;display:block;line-height:1.2}
header small{opacity:.85;font-size:10px;display:block;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .acts{display:flex;gap:6px;flex:none}
header .acts button{width:34px;height:34px;border:0;border-radius:8px;background:rgba(255,255,255,.18);color:#fff;font-size:16px;position:relative;line-height:1}
header .acts button span{position:absolute;top:-4px;right:-4px;background:#fa5151;color:#fff;font-size:9px;border-radius:8px;padding:0 4px;line-height:13px}
#log{padding:64px 12px 8px;max-width:760px;margin:0 auto;padding-bottom:8px}
.sys{text-align:center;font-size:11px;color:#9ca3af;margin:6px 0 10px}
.msg{display:flex;margin:10px 0}
.msg.me{justify-content:flex-end}
.bub{max-width:78%;padding:9px 12px;border-radius:8px;white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line)}
.msg.me .bub{background:var(--me);border-color:#7ed321}
.meta{margin-top:5px;display:flex;gap:8px;font-size:11px;color:var(--sub);align-items:center}
.msg.me .meta{justify-content:flex-end}
.meta button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 8px;font-size:11px;color:var(--sub)}
#chips{position:fixed;left:0;right:0;bottom:56px;display:flex;gap:8px;padding:6px 12px;overflow-x:auto;max-width:760px;margin:0 auto;z-index:15;-webkit-overflow-scrolling:touch}
#chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:12px;color:#374151;white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:8px;max-width:760px;margin:0 auto;z-index:16;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.bar input{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;min-width:0}
.bar button{padding:0 16px;background:var(--brand);color:#fff;border:0;border-radius:8px;font-size:15px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;max-width:760px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.ov .ohead{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:10px;z-index:5}
.ov .ohead b{flex:1;font-size:15px}
.ov .ohead button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px}
.hide{display:none!important}
.page{padding:12px 12px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px}
.card label{display:block;font-size:12px;color:var(--sub);margin:8px 0 4px}
.card input,.card textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit}
.card textarea{min-height:96px;resize:vertical}
.btn{padding:10px 16px;background:var(--brand);color:#fff;border:0;border-radius:8px;font-size:14px;width:100%;margin-bottom:10px}
.btn.ghost{background:#fff;color:var(--txt);border:1px solid var(--line)}
.tip{background:#fff8e6;border:1px solid #ffe0a3;border-radius:8px;padding:10px;font-size:13px;margin-bottom:12px;line-height:1.6}
.fb{border-bottom:1px solid var(--line);padding:9px 0;font-size:13px}
.fb .q{font-weight:600}
.fb .a{color:var(--sub);margin:3px 0}
</style>
</head>
<body>
<header>
  <div class="av">富</div>
  <div class="ttl"><b>富足到家 · AI客服</b><small id="sub">试用演示版 · 未接真实业务</small></div>
  <div class="acts">
    <button onclick="openSet()" title="改资料">⚙️</button>
    <button onclick="openFB()" title="需求清单">📋<span id="fbn"></span></button>
  </div>
</header>

<div id="log"></div>

<div id="chips">
  <button onclick="quick('有什么项目')">有什么项目</button>
  <button onclick="quick('价格多少')">价格多少</button>
  <button onclick="quick('怎么预约')">怎么预约</button>
  <button onclick="quick('转人工')">转人工</button>
</div>

<div class="bar">
  <input id="inp" placeholder="以客人身份打字，测 AI 答得准不准" onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">发送</button>
</div>

<div id="p-set" class="ov hide">
  <div class="ohead"><b>⚙️ 改资料（先填真实数据再测）</b><button onclick="closeOv('p-set')">关闭</button></div>
  <div class="page">
    <div class="tip"><b>必做：</b>下面预填的是<b>行业通用口径</b>，不是你们家的真实数据。逐条改成真实价目与规则，点「保存并生效」后立刻生效，再去测对话。不改就测，测出来的全是错的。</div>
    <div class="card">
      <h3>一、项目与价格（每行：项目名 | 价格 | 一句话说明 | 标签）</h3>
      <textarea id="s_services"></textarea>
    </div>
    <div class="card">
      <h3>二、活动（每行：活动名 | 说明）</h3>
      <textarea id="s_acts"></textarea>
    </div>
    <div class="card">
      <h3>三、规则</h3>
      <label>上门费/距离</label><input id="s_fee">
      <label>下单锁总价</label><input id="s_upfront">
      <label>安全与保障（每行一条）</label><textarea id="s_safety" style="min-height:80px"></textarea>
      <label>预约流程（每行一步）</label><textarea id="s_booking" style="min-height:80px"></textarea>
    </div>
    <div class="card">
      <h3>四、话术</h3>
      <label>开场白</label><input id="s_greet">
      <label>报价格前缀</label><input id="s_pp">
      <label>报价后追问</label><input id="s_ps">
      <label>看项目后追问</label><input id="s_ss">
      <label>转人工</label><input id="s_transfer">
      <label>越界划界</label><input id="s_boundary">
      <label>兜底</label><input id="s_fallback">
    </div>
    <div class="card">
      <h3>五、常见问答（每行：关键词,逗号分隔 | 问题 | 答案）</h3>
      <textarea id="s_faq"></textarea>
    </div>
    <button class="btn" onclick="saveKB()">保存并生效</button>
    <button class="btn ghost" onclick="closeOv('p-set')">返回对话</button>
  </div>
</div>

<div id="p-fb" class="ov hide">
  <div class="ohead"><b>📋 需求清单</b><button onclick="closeOv('p-fb')">关闭</button></div>
  <div class="page">
    <div class="tip">答得不对的地方点 👎，攒成需求清单，<b>导出文件发回给对接人</b>，见面直接拿它谈。</div>
    <div class="card"><h3>已收集的问题（<span id="fbc">0</span>）</h3><div id="fblist"></div></div>
    <button class="btn" onclick="exportFB()">导出清单（Markdown）</button>
    <button class="btn ghost" onclick="clearFB()">清空</button>
  </div>
</div>

    if(hit(m,KB.faq[k].keys||[]))return{t:KB.faq[k].a,i:'faq:'+KB.faq[k].q};

  var rec=byPain(m,KB);
  if(rec.length&&!hit(m,['多少钱','价格','收费','价位'])){
    var l2=['您这个情况我们建议这个👇'];
    for(var a=0;a<rec.length;a++)l2.push('· '+rec[a].name+'（'+rec[a].tag+'）：'+rec[a].desc+'，'+rec[a].price);
    l2.push(KB.lead_questions.ask_time);return{t:l2.join('\n'),i:'recommend'};
  }
  if(hit(m,['价格','多少钱','收费','价位','多少','贵','预算'])){
    var l3=[S.price_prefix];
    for(var b=0;b<KB.services.length;b++)l3.push('· '+KB.services[b].name+'（'+KB.services[b].tag+'）：'+KB.services[b].price);
    l3.push(S.price_suffix);return{t:l3.join('\n'),i:'price'};
  }
  if(hit(m,['项目','有什么','做啥','能做什么','按摩','推拿','spa','服务','调理'])){
    var l4=['我们主打正规上门项目，您看哪个合适：'];
    for(var c=0;c<KB.services.length;c++)l4.push('· '+KB.services[c].name+'：'+KB.services[c].desc+'（'+KB.services[c].price+'）');
    l4.push(S.service_suffix);return{t:l4.join('\n'),i:'service'};
  }
  if(hit(m,['正规','安全','靠谱','骗子','持证','资质','可信','真吗','假的','放心','隐私'])){
    var sf=KB.safety||[];
    return{t:'放心~ '+(sf[0]||'')+' '+(sf[1]||'')+' '+(KB.fee_rules||{}).no_hidden+' 需要我帮您预约体验吗？',i:'safety'};
  }
  if(hit(m,['男生','男的','男士','女技师','男技师','指定','选人']))
    return{t:'可以，男女技师都有，下单时备注偏好就行，系统按需求派单~ 想约哪个项目？',i:'gender'};
  var loc=m.match(/[\u4e00-\u9fa5]{2,10}?(市|区|县|镇|街道|小区)/);
  if(hit(m,['城市','哪里','覆盖','地址','区域','住在','我在','我家','小区','这边','我住'])||loc){
    if(loc){
      var p=loc[0].replace(/^(我?(家|住)?在?|住在|地址是|这边是)/,'');
      return{t:'好的，'+p+'这边我们能上门~ 方便说下想约什么项目、什么时候方便吗？我帮您提交。',i:'loc_confirmed'};
    }
    return{t:'我们已开通 156 个城市站点，您在哪个城市？我帮您确认附近站点并安排。',i:'location'};
  }
  if(hit(m,['今天','明天','后天','晚上','下午','上午','中午','周末','礼拜','方便','几点','现在'])||/[0-9]{1,2}[:：点]/.test(m))
    return{t:'好的，您这边时间我先记下~ 麻烦再确认下项目和上门地址（哪个城市哪个小区），我马上帮您提交预约。',i:'time_given'};
  if(hit(m,['上门费','多远','距离','车费','路费','免车费'])){
    var fr=KB.fee_rules||{};return{t:(fr.distance||'')+' '+(fr.upfront||''),i:'fee'};
  }
  if(hit(m,['怎么约','预约','下单','流程','怎么弄','怎么定','怎么买','怎么订','怎么开始'])){
    var st=(KB.booking||{}).steps||[],out='预约很简单，四步搞定：\n';
    for(var e=0;e<st.length;e++)out+=(e+1)+'. '+st[e]+'\n';
    out+=(KB.booking||{}).note||'';out+=(KB.lead_questions||{}).ask_first||'';
    return{t:out,i:'booking'};
  }
  if(hit(m,['效果','有用','能好','治','根治','病','疼','酸']))
    return{t:'正规推拿和 SPA 主要帮助缓解疲劳、改善睡眠、放松肌肉，属于日常养护。如果有明确疾病还是建议先去医院。您主要是哪里不舒服？我给您挑项目。',i:'effect'};
  for(var q=0;q<KB.faq.length;q++)if(hit(m,KB.faq[q].keys||[]))return{t:KB.faq[q].a,i:'faq:'+KB.faq[q].q};
  return{t:KB.fallback,i:'fallback'};
}
function S2(KB,k){return k==='transfer'?KB.transfer_script:KB.boundary_script}

/* ---- 界面 ---- */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function scrollBottom(){window.scrollTo(0,document.body.scrollHeight)}
function add(m,who,i){
  var d=document.createElement('div');
  d.className='msg '+who;
  var h='<div class="bub">'+esc(m)+'</div>';
  if(who==='ai')h+='<div class="meta"><span>'+esc(i||'')+'</span><button onclick="mark('+fb.length+',0)">👍对</button><button onclick="mark('+fb.length+',1)">👎答得不对</button></div>';
  d.innerHTML=h;document.getElementById('log').appendChild(d);
  scrollBottom();
}
function quick(v){document.getElementById('inp').value=v;send()}
function send(){
  var v=document.getElementById('inp').value.trim();if(!v)return;
  document.getElementById('inp').value='';
  add(v,'me');hist.push({user:v,bot:''});
  var r=reply(v);
  setTimeout(function(){add(r.t,'ai',r.i);hist[hist.length-1].bot=r.t;
    if(hist.length>20)hist=hist.slice(-20)},80);
}
function mark(idx,bad){
  var h=hist[idx];if(!h)return;
  if(!bad){alert('已记录 👍');return}
  var why=prompt('哪里不对？（例：价格不对 / 太机械 / 会说错话 / 答非所问）','价格不对');
  if(why===null)return;
  fb.push({user:h.user,bot:h.bot,reason:why,ts:new Date().toISOString().slice(0,16)});
  try{localStorage.setItem(LS_FB,JSON.stringify(fb))}catch(e){}
  renderFB();alert('已记录，需求清单 +1');
}
function openSet(){fillSet();document.getElementById('p-set').className='ov'}
function openFB(){renderFB();document.getElementById('p-fb').className='ov'}
function closeOv(id){document.getElementById(id).className='ov hide'}
function fillSet(){
  var KB=getKB();
  document.getElementById('s_services').value=KB.services.map(function(s){return s.name+' | '+s.price+' | '+s.desc+' | '+s.tag}).join('\n');
  document.getElementById('s_acts').value=KB.activities.map(function(a){return a.name+' | '+a.desc}).join('\n');
  document.getElementById('s_fee').value=(KB.fee_rules||{}).distance||'';
  document.getElementById('s_upfront').value=(KB.fee_rules||{}).upfront||'';
  document.getElementById('s_safety').value=(KB.safety||[]).join('\n');
  document.getElementById('s_booking').value=((KB.booking||{}).steps||[]).join('\n');
  var S=KB.lead_script||{};
  document.getElementById('s_greet').value=S.greeting||'';
  document.getElementById('s_pp').value=S.price_prefix||'';
  document.getElementById('s_ps').value=S.price_suffix||'';
  document.getElementById('s_ss').value=S.service_suffix||'';
  document.getElementById('s_transfer').value=KB.transfer_script||'';
  document.getElementById('s_boundary').value=KB.boundary_script||'';
  document.getElementById('s_fallback').value=KB.fallback||'';
  document.getElementById('s_faq').value=KB.faq.map(function(f){return (f.keys||[]).join(',')+' | '+f.q+' | '+f.a}).join('\n');
}
function saveKB(){
  var KB=getKB();
  KB.services=document.getElementById('s_services').value.split('\n').filter(Boolean).map(function(l){
    var p=l.split('|').map(function(x){return (x||'').trim()});
    var old=KB.services.filter(function(s){return s.name===p[0]})[0]||{};
    return{name:p[0]||'',price:p[1]||'',desc:p[2]||'',tag:p[3]||'',pain:old.pain||[]};
  });
  KB.activities=document.getElementById('s_acts').value.split('\n').filter(Boolean).map(function(l){
    var p=l.split('|').map(function(x){return (x||'').trim()});
    return{name:p[0]||'',desc:p[1]||''};
  });
  var fr=KB.fee_rules||{};
  fr.distance=document.getElementById('s_fee').value;fr.upfront=document.getElementById('s_upfront').value;KB.fee_rules=fr;
  KB.safety=document.getElementById('s_safety').value.split('\n').filter(Boolean);
  KB.booking=KB.booking||{};KB.booking.steps=document.getElementById('s_booking').value.split('\n').filter(Boolean);
  var S=KB.lead_script||{};
  S.greeting=document.getElementById('s_greet').value;S.price_prefix=document.getElementById('s_pp').value;
  S.price_suffix=document.getElementById('s_ps').value;S.service_suffix=document.getElementById('s_ss').value;
  KB.lead_script=S;KB.transfer_script=document.getElementById('s_transfer').value;
  KB.boundary_script=document.getElementById('s_boundary').value;KB.fallback=document.getElementById('s_fallback').value;
  KB.faq=document.getElementById('s_faq').value.split('\n').filter(Boolean).map(function(l){
    var p=l.split('|');return{keys:(p[0]||'').split(',').map(function(x){return x.trim()}).filter(Boolean),q:(p[1]||'').trim(),a:(p[2]||'').trim()};
  });
  saveStore();alert('已保存，立刻生效。回对话再测一遍。');
}
function loadFB(){try{return JSON.parse(localStorage.getItem(LS_FB)||'[]')}catch(e){return[]}}
function renderFB(){
  fb=loadFB();
  document.getElementById('fbc').textContent=fb.length;
  document.getElementById('fbn').textContent=fb.length?'('+fb.length+')':'';
  var h='';
  for(var i=0;i<fb.length;i++)h+='<div class="fb"><div class="q">客人：'+esc(fb[i].user)+'</div><div class="a">AI：'+esc(fb[i].bot)+'</div><div class="a">❌ '+esc(fb[i].reason)+'　<span style="opacity:.6">'+esc(fb[i].ts)+'</span></div></div>';
  document.getElementById('fblist').innerHTML=h||'<div class="a" style="color:#9ca3af">还没有记录。回对话，遇到答得不对的点👎。</div>';
}
function clearFB(){if(confirm('清空全部已收集的问题？')){fb=[];try{localStorage.removeItem(LS_FB)}catch(e){}renderFB()}}
function exportFB(){
  if(!fb.length){alert('还没有收集到问题，先去测一轮');return}
  var t='# 富足到家 · AI 客服试用问题清单\n\n导出时间：'+new Date().toLocaleString()+'\n共 '+fb.length+' 条\n\n';
  fb.forEach(function(x,i){t+='## '+(i+1)+'. '+x.reason+'\n- 客人问：'+x.user+'\n- AI 答：'+x.bot+'\n- 问题：'+x.reason+'\n- 时间：'+x.ts+'\n\n'});
  t+='---\n说明：每一条都是试用中发现需要改的地方，请按「一期做/二期做/做不了」分类后再谈。\n';
  try{
    var b=new Blob([t],{type:'text/markdown;charset=utf-8'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='AI客服试用问题清单.md';a.click();
    alert('已导出，请把文件发给对接人。');
  }catch(e){
    var d=document.createElement('textarea');d.value=t;document.body.appendChild(d);d.select();
    try{document.execCommand('copy');alert('已复制到剪贴板，粘贴保存为 .md 文件即可')}catch(e2){alert('请手动复制下方内容')}
    document.body.removeChild(d);
  }
}
/* init */
fb=loadFB();renderFB();
(function(){var d=document.createElement('div');d.className='sys';d.textContent='试用演示版 · 网页模拟，未接入真实客户';document.getElementById('log').appendChild(d)})();
add(getKB().lead_script.greeting,'ai','greeting');
</script>
